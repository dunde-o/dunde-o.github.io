<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18181b"/>
      <stop offset="100%" style="stop-color:#27272a"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="scrollTrack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3f3f46"/>
      <stop offset="100%" style="stop-color:#27272a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- Abstract scroll lines -->
  <g opacity="0.1">
    <path d="M0 100 Q300 80 600 120 T1200 100" stroke="#f97316" stroke-width="2" fill="none"/>
    <path d="M0 200 Q300 180 600 220 T1200 200" stroke="#f97316" stroke-width="2" fill="none"/>
    <path d="M0 300 Q300 280 600 320 T1200 300" stroke="#f97316" stroke-width="2" fill="none"/>
    <path d="M0 400 Q300 380 600 420 T1200 400" stroke="#f97316" stroke-width="2" fill="none"/>
    <path d="M0 500 Q300 480 600 520 T1200 500" stroke="#f97316" stroke-width="2" fill="none"/>
  </g>

  <!-- Blog content area -->
  <g transform="translate(100, 100)">
    <rect width="600" height="430" rx="16" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>

    <!-- Content lines representing headings and text -->
    <!-- H1 -->
    <rect x="40" y="40" width="300" height="24" rx="4" fill="#f97316"/>

    <!-- Paragraph -->
    <rect x="40" y="80" width="520" height="10" rx="5" fill="#3f3f46"/>
    <rect x="40" y="96" width="480" height="10" rx="5" fill="#3f3f46"/>
    <rect x="40" y="112" width="450" height="10" rx="5" fill="#3f3f46"/>

    <!-- H2 - Active section -->
    <rect x="40" y="150" width="220" height="20" rx="4" fill="#f97316" opacity="0.8"/>

    <!-- Active section indicator -->
    <rect x="30" y="148" width="4" height="24" rx="2" fill="#f97316"/>

    <!-- Paragraph -->
    <rect x="40" y="186" width="520" height="10" rx="5" fill="#3f3f46"/>
    <rect x="40" y="202" width="500" height="10" rx="5" fill="#3f3f46"/>
    <rect x="40" y="218" width="460" height="10" rx="5" fill="#3f3f46"/>
    <rect x="40" y="234" width="490" height="10" rx="5" fill="#3f3f46"/>

    <!-- H2 -->
    <rect x="40" y="270" width="180" height="20" rx="4" fill="#52525b"/>

    <!-- Paragraph -->
    <rect x="40" y="306" width="520" height="10" rx="5" fill="#3f3f46"/>
    <rect x="40" y="322" width="480" height="10" rx="5" fill="#3f3f46"/>

    <!-- H3 -->
    <rect x="60" y="355" width="150" height="16" rx="4" fill="#52525b"/>

    <!-- Paragraph -->
    <rect x="60" y="385" width="500" height="10" rx="5" fill="#3f3f46"/>
    <rect x="60" y="401" width="460" height="10" rx="5" fill="#3f3f46"/>
  </g>

  <!-- Scroll indicator on content -->
  <g transform="translate(680, 100)">
    <rect x="0" y="0" width="8" height="430" rx="4" fill="url(#scrollTrack)"/>
    <rect x="0" y="100" width="8" height="80" rx="4" fill="#f97316"/>
  </g>

  <!-- TOC Sidebar -->
  <g transform="translate(780, 140)">
    <rect width="320" height="350" rx="16" fill="#27272a" stroke="#f97316" stroke-width="2"/>

    <!-- TOC Header -->
    <rect x="20" y="20" width="4" height="300" rx="2" fill="#3f3f46"/>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#a1a1aa">Table of Contents</text>

    <!-- TOC Items -->
    <!-- Item 1 -->
    <text x="40" y="85" font-family="Arial, sans-serif" font-size="14" fill="#71717a">Introduction</text>

    <!-- Item 2 - Active -->
    <rect x="20" y="100" width="4" height="24" rx="2" fill="#f97316"/>
    <text x="40" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f97316">Getting Started</text>

    <!-- Item 3 -->
    <text x="40" y="155" font-family="Arial, sans-serif" font-size="14" fill="#71717a">Configuration</text>

    <!-- Item 3-1 (nested) -->
    <text x="60" y="185" font-family="Arial, sans-serif" font-size="13" fill="#52525b">Basic Setup</text>

    <!-- Item 3-2 (nested) -->
    <text x="60" y="212" font-family="Arial, sans-serif" font-size="13" fill="#52525b">Advanced Options</text>

    <!-- Item 4 -->
    <text x="40" y="250" font-family="Arial, sans-serif" font-size="14" fill="#71717a">API Reference</text>

    <!-- Item 5 -->
    <text x="40" y="285" font-family="Arial, sans-serif" font-size="14" fill="#71717a">Examples</text>

    <!-- Scroll indicator -->
    <rect x="290" y="20" width="6" height="80" rx="3" fill="#3f3f46"/>
  </g>

  <!-- Connection line -->
  <g>
    <path d="M700 280 Q740 280 760 250" stroke="#f97316" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.6"/>
    <circle cx="760" cy="250" r="4" fill="#f97316"/>
  </g>

  <!-- IntersectionObserver visualization -->
  <g transform="translate(100, 100)">
    <!-- Viewport indicator -->
    <rect x="-10" y="130" width="620" height="120" rx="8" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    <text x="550" y="155" font-family="monospace" font-size="11" fill="#f97316" opacity="0.7">viewport</text>
  </g>

  <!-- Floating eye icon (observer) -->
  <g transform="translate(50, 300)" opacity="0.3">
    <circle cx="30" cy="30" r="25" fill="none" stroke="#f97316" stroke-width="3"/>
    <circle cx="30" cy="30" r="12" fill="#f97316"/>
    <circle cx="30" cy="30" r="5" fill="#18181b"/>
  </g>

  <!-- Code hint -->
  <g transform="translate(800, 520)">
    <rect width="300" height="60" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="12" fill="#f97316">IntersectionObserver</text>
    <text x="15" y="45" font-family="monospace" font-size="11" fill="#71717a">rootMargin: "-80px 0px -80%"</text>
  </g>

  <!-- Smooth scroll arrow -->
  <g transform="translate(450, 520)">
    <path d="M0 0 L0 60" stroke="#f97316" stroke-width="3" opacity="0.5"/>
    <path d="M-10 50 L0 65 L10 50" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="12" fill="#71717a">smooth scroll</text>
  </g>
</svg>
