<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg1)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#667eea" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#667eea" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#667eea" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#667eea" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#667eea" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#667eea" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#667eea" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#667eea" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#667eea" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#667eea" stroke-width="1"/>
  </g>

  <!-- Quiz Card -->
  <rect x="100" y="150" width="450" height="330" rx="20" fill="#252542" stroke="#667eea" stroke-width="2"/>

  <!-- Question mark icon -->
  <circle cx="160" cy="210" r="30" fill="url(#accent1)"/>
  <text x="160" y="222" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">?</text>

  <!-- Question text lines -->
  <rect x="210" y="195" width="300" height="12" rx="6" fill="#3d3d5c"/>
  <rect x="210" y="215" width="220" height="12" rx="6" fill="#3d3d5c"/>

  <!-- Options -->
  <g>
    <!-- Option 1 -->
    <rect x="140" y="260" width="370" height="40" rx="10" fill="#3d3d5c"/>
    <circle cx="165" cy="280" r="12" fill="none" stroke="#667eea" stroke-width="2"/>
    <rect x="190" y="274" width="180" height="12" rx="6" fill="#4a4a6a"/>

    <!-- Option 2 - Selected/Correct -->
    <rect x="140" y="310" width="370" height="40" rx="10" fill="#1a4d3e"/>
    <circle cx="165" cy="330" r="12" fill="#10b981"/>
    <path d="M159 330 L163 334 L172 325" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="190" y="324" width="200" height="12" rx="6" fill="#2d7a5e"/>

    <!-- Option 3 -->
    <rect x="140" y="360" width="370" height="40" rx="10" fill="#3d3d5c"/>
    <circle cx="165" cy="380" r="12" fill="none" stroke="#667eea" stroke-width="2"/>
    <rect x="190" y="374" width="160" height="12" rx="6" fill="#4a4a6a"/>

    <!-- Option 4 -->
    <rect x="140" y="410" width="370" height="40" rx="10" fill="#3d3d5c"/>
    <circle cx="165" cy="430" r="12" fill="none" stroke="#667eea" stroke-width="2"/>
    <rect x="190" y="424" width="140" height="12" rx="6" fill="#4a4a6a"/>
  </g>

  <!-- React Logo -->
  <g transform="translate(750, 280)">
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#61dafb" stroke-width="3" opacity="0.8" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="14" fill="#61dafb"/>
  </g>

  <!-- Shuffle arrows -->
  <g transform="translate(950, 350)">
    <path d="M0 0 L40 0 L30 -15 M40 0 L30 15" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 40 L40 40 L50 25 M40 40 L50 55" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Code snippet decoration -->
  <g transform="translate(620, 450)">
    <rect width="480" height="120" rx="10" fill="#1e1e3f" stroke="#3d3d5c" stroke-width="1"/>
    <circle cx="25" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="45" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="65" cy="20" r="6" fill="#27ca40"/>
    <text x="25" y="55" font-family="monospace" font-size="14" fill="#667eea">const</text>
    <text x="75" y="55" font-family="monospace" font-size="14" fill="#e2e8f0">shuffledOptions = </text>
    <text x="25" y="80" font-family="monospace" font-size="14" fill="#f59e0b">  shuffleWithAnswer</text>
    <text x="195" y="80" font-family="monospace" font-size="14" fill="#e2e8f0">(options, answer);</text>
  </g>

  <!-- Floating elements -->
  <text x="850" y="180" font-family="Arial, sans-serif" font-size="48" fill="#667eea" opacity="0.3">{ }</text>
  <text x="1050" y="250" font-family="Arial, sans-serif" font-size="36" fill="#764ba2" opacity="0.3">&lt;/&gt;</text>
</svg>
