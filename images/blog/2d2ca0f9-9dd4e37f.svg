<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ssgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#61dafb" />
      <stop offset="100%" style="stop-color:#646cff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#61dafb" opacity="0.03"/>
  <circle cx="1100" cy="530" r="250" fill="#646cff" opacity="0.05"/>

  <!-- Centered text group -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle">
    <tspan fill="#61dafb">React</tspan>
    <tspan fill="#666" font-weight="300" dx="15">+</tspan>
    <tspan fill="#646cff" font-weight="bold" dx="15">Vite</tspan>
    <tspan fill="#666" font-weight="300" dx="15">+</tspan>
    <tspan fill="url(#ssgGradient)" font-weight="bold" dx="15">SSG</tspan>
  </text>

  <!-- Title -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">
    정적 사이트 생성으로 SEO 최적화하기
  </text>

  <!-- Subtitle -->
  <text x="600" y="510" font-family="Arial, sans-serif" font-size="24" fill="#888" text-anchor="middle">
    vite-react-ssg 적용 가이드
  </text>

  <!-- Bottom line accent -->
  <rect x="400" y="560" width="400" height="3" rx="1.5" fill="url(#ssgGradient)"/>
</svg>
