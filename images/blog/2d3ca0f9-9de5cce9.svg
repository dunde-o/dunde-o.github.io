    <circle cx="150" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="250" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="350" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="450" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="550" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="650" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="750" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="850" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="950" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="1050" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="1150" cy="50" r="3" fill="#06b6d4"/>
    <circle cx="50" cy="150" r="3" fill="#06b6d4"/>
    <circle cx="150" cy="150" r="3" fill="#06b6d4"/>
