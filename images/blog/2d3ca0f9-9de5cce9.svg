    <circle cx="50" cy="250" r="3" fill="#06b6d4"/>
    <circle cx="150" cy="250" r="3" fill="#06b6d4"/>
    <circle cx="50" cy="350" r="3" fill="#06b6d4"/>
    <circle cx="150" cy="350" r="3" fill="#06b6d4"/>
    <circle cx="50" cy="450" r="3" fill="#06b6d4"/>
    <circle cx="150" cy="450" r="3" fill="#06b6d4"/>
    <circle cx="250" cy="450" r="3" fill="#06b6d4"/>
    <circle cx="50" cy="550" r="3" fill="#06b6d4"/>
    <circle cx="150" cy="550" r="3" fill="#06b6d4"/>
    <circle cx="250" cy="550" r="3" fill="#06b6d4"/>
    <circle cx="350" cy="550" r="3" fill="#06b6d4"/>
    <circle cx="950" cy="150" r="3" fill="#06b6d4"/>
    <circle cx="1050" cy="150" r="3" fill="#06b6d4"/>
    <circle cx="1150" cy="150" r="3" fill="#06b6d4"/>
    <circle cx="1050" cy="250" r="3" fill="#06b6d4"/>
    <circle cx="1150" cy="250" r="3" fill="#06b6d4"/>
    <circle cx="1050" cy="350" r="3" fill="#06b6d4"/>
    <circle cx="1150" cy="350" r="3" fill="#06b6d4"/>
    <circle cx="850" cy="450" r="3" fill="#06b6d4"/>
    <circle cx="950" cy="450" r="3" fill="#06b6d4"/>
    <circle cx="1050" cy="450" r="3" fill="#06b6d4"/>
    <circle cx="1150" cy="450" r="3" fill="#06b6d4"/>
    <circle cx="850" cy="550" r="3" fill="#06b6d4"/>
    <circle cx="950" cy="550" r="3" fill="#06b6d4"/>
    <circle cx="1050" cy="550" r="3" fill="#06b6d4"/>
    <circle cx="1150" cy="550" r="3" fill="#06b6d4"/>
  </g>

  <!-- Search bar -->
  <rect x="200" y="180" width="800" height="70" rx="35" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="260" cy="215" r="20" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <line x1="275" y1="230" x2="290" y2="245" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>

  <!-- Search text with tokens -->
  <text x="320" y="222" font-family="monospace" font-size="24" fill="#f43f5e">!ADP</text>
  <text x="420" y="222" font-family="monospace" font-size="24" fill="#e2e8f0">React</text>
  <text x="540" y="222" font-family="monospace" font-size="24" fill="#8b5cf6">@개발</text>
  <text x="650" y="222" font-family="monospace" font-size="24" fill="#06b6d4">#공부</text>

  <!-- Cursor blink -->
  <rect x="780" y="195" width="3" height="40" fill="#06b6d4" opacity="0.8"/>

  <!-- Filter tags legend -->
  <g transform="translate(250, 290)">
    <rect x="0" y="0" width="80" height="36" rx="18" fill="#f43f5e20" stroke="#f43f5e" stroke-width="1"/>
    <text x="40" y="24" font-family="Arial, sans-serif" font-size="14" fill="#f43f5e" text-anchor="middle">!시리즈</text>

    <rect x="100" y="0" width="90" height="36" rx="18" fill="#8b5cf620" stroke="#8b5cf6" stroke-width="1"/>
    <text x="145" y="24" font-family="Arial, sans-serif" font-size="14" fill="#8b5cf6" text-anchor="middle">@카테고리</text>

    <rect x="210" y="0" width="70" height="36" rx="18" fill="#06b6d420" stroke="#06b6d4" stroke-width="1"/>
    <text x="245" y="24" font-family="Arial, sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle">#태그</text>
  </g>

  <!-- Search results cards -->
  <g transform="translate(200, 370)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="380" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="20" width="60" height="24" rx="12" fill="#f43f5e30"/>
    <text x="50" y="38" font-family="Arial, sans-serif" font-size="12" fill="#f43f5e" text-anchor="middle">ADP</text>
    <rect x="90" y="20" width="50" height="24" rx="12" fill="#06b6d430"/>
    <text x="115" y="38" font-family="Arial, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle">공부</text>
    <rect x="20" y="55" width="280" height="14" rx="7" fill="#334155"/>
    <rect x="20" y="75" width="200" height="10" rx="5" fill="#293548"/>

    <!-- Card 2 -->
    <rect x="0" y="120" width="380" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="140" width="60" height="24" rx="12" fill="#f43f5e30"/>
    <text x="50" y="158" font-family="Arial, sans-serif" font-size="12" fill="#f43f5e" text-anchor="middle">ADP</text>
    <rect x="90" y="140" width="60" height="24" rx="12" fill="#8b5cf630"/>
    <text x="120" y="158" font-family="Arial, sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle">자격증</text>
    <rect x="20" y="175" width="320" height="14" rx="7" fill="#334155"/>
    <rect x="20" y="195" width="180" height="10" rx="5" fill="#293548"/>
  </g>

  <!-- URL bar -->
  <g transform="translate(620, 400)">
    <rect x="0" y="0" width="380" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" font-family="monospace" font-size="14" fill="#64748b">/blog?q=</text>
    <text x="105" y="32" font-family="monospace" font-size="14" fill="#f43f5e">!ADP</text>
    <text x="155" y="32" font-family="monospace" font-size="14" fill="#64748b">%20React</text>
  </g>

  <!-- Magnifying glass decoration -->
  <g transform="translate(900, 200)" opacity="0.2">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#06b6d4" stroke-width="8"/>
    <line x1="42" y1="42" x2="80" y2="80" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- React logo small -->
  <g transform="translate(1050, 500)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="none" stroke="#61dafb" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="7" fill="#61dafb"/>
  </g>
</svg>
