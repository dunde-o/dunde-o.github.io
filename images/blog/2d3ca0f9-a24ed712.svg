<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- GitHub-style contribution graph pattern -->
  <g opacity="0.1" transform="translate(50, 500)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#238636"/>
    <rect x="16" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.3"/>
    <rect x="32" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.6"/>
    <rect x="48" y="0" width="12" height="12" rx="2" fill="#238636"/>
    <rect x="64" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.3"/>
    <rect x="80" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.8"/>
    <rect x="96" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.4"/>
    <rect x="112" y="0" width="12" height="12" rx="2" fill="#238636"/>
    <rect x="0" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.5"/>
    <rect x="16" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.7"/>
    <rect x="32" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.2"/>
    <rect x="48" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.9"/>
    <rect x="64" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.4"/>
    <rect x="80" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.6"/>
    <rect x="96" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.3"/>
    <rect x="112" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.8"/>
  </g>

  <g opacity="0.1" transform="translate(1050, 80)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.4"/>
    <rect x="16" y="0" width="12" height="12" rx="2" fill="#238636"/>
    <rect x="32" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.7"/>
    <rect x="48" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.3"/>
    <rect x="64" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.9"/>
    <rect x="80" y="0" width="12" height="12" rx="2" fill="#238636" opacity="0.5"/>
    <rect x="0" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.8"/>
    <rect x="16" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.2"/>
    <rect x="32" y="16" width="12" height="12" rx="2" fill="#238636"/>
    <rect x="48" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.6"/>
    <rect x="64" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.4"/>
    <rect x="80" y="16" width="12" height="12" rx="2" fill="#238636" opacity="0.7"/>
  </g>

  <!-- GitHub Logo -->
  <g transform="translate(550, 100)">
    <circle cx="50" cy="50" r="60" fill="#21262d"/>
    <path d="M50 15 C28 15 10 33 10 55 C10 73 22 88 39 93 C41 93.5 42 92.5 42 91 L42 84 C29 87 26 78 26 78 C24 73 21 71 21 71 C17 68 21 68 21 68 C26 68.5 28 73 28 73 C33 81 41 78 43 76 C43.5 73 44.5 71 46 70 C36 69 25 65 25 51 C25 46 27 42 30 39 C29.5 38 28 33 30.5 27 C30.5 27 35 26 42 31 C46 30 50 29.5 54 29.5 C58 29.5 62 30 66 31 C73 26 77.5 27 77.5 27 C80 33 78.5 38 78 39 C81 42 83 46 83 51 C83 65 72 69 62 70 C64 72 66 75 66 80 L66 91 C66 92.5 67 93.5 69 93 C86 88 98 73 98 55 C98 33 80 15 58 15 Z" fill="#c9d1d9" transform="scale(0.8) translate(5, 10)"/>
  </g>

  <!-- Discussions icon -->
  <g transform="translate(100, 180)">
    <rect width="400" height="280" rx="16" fill="#21262d" stroke="#30363d" stroke-width="2"/>

    <!-- Header -->
    <rect x="0" y="0" width="400" height="50" rx="16" fill="#161b22"/>
    <rect x="384" y="34" width="16" height="246" rx="0" fill="#161b22"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c9d1d9">Discussions</text>
    <circle cx="370" cy="25" r="10" fill="#238636"/>
    <text x="370" y="30" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">3</text>

    <!-- Comment 1 -->
    <g transform="translate(20, 70)">
      <circle cx="20" cy="20" r="20" fill="#2ea043"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">A</text>
      <rect x="50" y="5" width="300" height="50" rx="8" fill="#0d1117"/>
      <rect x="60" y="18" width="200" height="10" rx="5" fill="#30363d"/>
      <rect x="60" y="35" width="150" height="8" rx="4" fill="#21262d"/>
    </g>

    <!-- Comment 2 -->
    <g transform="translate(20, 150)">
      <circle cx="20" cy="20" r="20" fill="#8b5cf6"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">B</text>
      <rect x="50" y="5" width="300" height="50" rx="8" fill="#0d1117"/>
      <rect x="60" y="18" width="250" height="10" rx="5" fill="#30363d"/>
      <rect x="60" y="35" width="120" height="8" rx="4" fill="#21262d"/>
    </g>

    <!-- Reactions -->
    <g transform="translate(70, 220)">
      <rect x="0" y="0" width="50" height="28" rx="14" fill="#30363d"/>
      <text x="25" y="20" font-family="Arial, sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">+5</text>
      <rect x="60" y="0" width="50" height="28" rx="14" fill="#30363d"/>
      <text x="85" y="20" font-family="Arial, sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle">+2</text>
    </g>
  </g>

  <!-- Arrow connection -->
  <g transform="translate(520, 320)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#238636" stroke-width="3" stroke-dasharray="8,4"/>
    <polygon points="80,0 70,-8 70,8" fill="#238636"/>
  </g>

  <!-- Blog iframe representation -->
  <g transform="translate(620, 180)">
    <rect width="480" height="280" rx="16" fill="#21262d" stroke="#238636" stroke-width="2"/>

    <!-- Browser chrome -->
    <rect x="0" y="0" width="480" height="40" rx="16" fill="#161b22"/>
    <rect x="464" y="24" width="16" height="256" rx="0" fill="#161b22"/>
    <circle cx="25" cy="20" r="7" fill="#ff5f56"/>
    <circle cx="50" cy="20" r="7" fill="#ffbd2e"/>
    <circle cx="75" cy="20" r="7" fill="#27ca40"/>
    <rect x="100" y="12" width="280" height="20" rx="10" fill="#0d1117"/>
    <text x="120" y="26" font-family="monospace" font-size="11" fill="#8b949e">myblog.com/post/react-tips</text>

    <!-- Blog content -->
    <rect x="20" y="60" width="440" height="16" rx="8" fill="#30363d"/>
    <rect x="20" y="85" width="380" height="12" rx="6" fill="#21262d"/>
    <rect x="20" y="105" width="420" height="12" rx="6" fill="#21262d"/>

    <!-- Giscus widget -->
    <rect x="20" y="140" width="440" height="120" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="165" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">Comments (powered by giscus)</text>
    <rect x="40" y="180" width="400" height="60" rx="8" fill="#161b22"/>
    <text x="60" y="215" font-family="Arial, sans-serif" font-size="13" fill="#c9d1d9">Write a comment...</text>
  </g>

  <!-- Giscus logo text -->
  <text x="860" y="520" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#238636" opacity="0.3">giscus</text>

  <!-- Speech bubbles decoration -->
  <g transform="translate(950, 150)" opacity="0.2">
    <path d="M0 30 Q0 0 30 0 L70 0 Q100 0 100 30 L100 50 Q100 80 70 80 L40 80 L20 100 L25 80 L30 80 Q0 80 0 50 Z" fill="#238636"/>
  </g>
  <g transform="translate(80, 80)" opacity="0.15">
    <path d="M0 20 Q0 0 20 0 L60 0 Q80 0 80 20 L80 40 Q80 60 60 60 L30 60 L15 75 L18 60 L20 60 Q0 60 0 40 Z" fill="#238636"/>
  </g>
</svg>
